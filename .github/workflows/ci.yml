name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile .\src\gridlens.py .\GridLens.pyw
      - name: Self-test
        run: python .\src\gridlens.py --self-test
